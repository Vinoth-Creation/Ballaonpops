<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Shopping Cart - C# Logic Demo</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #1e1e2f;
    color: #f0f0f0;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .card {
    background: #2a2a3d;
    padding: 30px;
    border-radius: 10px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 20px;
    margin-bottom: 20px;
    text-align: center;
  }
  label {
    display: block;
    margin-top: 15px;
    margin-bottom: 5px;
    font-size: 14px;
  }
  select, input {
    width: 100%;
    padding: 8px;
    border-radius: 5px;
    border: none;
    font-size: 14px;
    box-sizing: border-box;
  }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover {
    background: #43a047;
  }
  .result {
    margin-top: 20px;
    background: #1e1e2f;
    padding: 15px;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
  }
  .error {
    color: #ff6b6b;
    margin-top: 10px;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🎈 Online Shopping Cart — C# Logic Demo</h1>

  <label for="productName">Product Name</label>
  <input type="text" id="productName" placeholder="e.g. Sofa">

  <label for="productType">Product Type</label>
  <select id="productType">
    <option value="furnitures">Furnitures (15% off)</option>
    <option value="clothings">Clothings (10% off)</option>
    <option value="toys">Toys (8% off)</option>
    <option value="others">Others (2% off)</option>
  </select>

  <label for="productPrice">Product Price</label>
  <input type="number" id="productPrice" placeholder="e.g. 25000">

  <label for="productQty">Quantity</label>
  <input type="number" id="productQty" placeholder="e.g. 3">

  <button onclick="calculate()">Calculate</button>

  <div class="error" id="errorMsg"></div>

  <div class="result" id="resultBox"></div>
</div>

<script>
// Mirrors the C# class structure: Product -> CategoryDiscount -> FinalPrice

class Product {
  constructor(name, type, price, qty) {
    this.productName = name;
    this.productType = type;
    this.productPrice = price;
    this.productQty = qty;
    this.totalPrice = price * qty;
  }
}

class CategoryDiscount extends Product {
  constructor(name, type, price, qty) {
    super(name, type, price, qty);
    this.discountPercentage = 0;
    this.discountPrice = 0;
    this.calculateDiscount();
  }

  calculateDiscount() {
    switch (this.productType) {
      case "furnitures":
        this.discountPercentage = 15;
        break;
      case "clothings":
        this.discountPercentage = 10;
        break;
      case "toys":
        this.discountPercentage = 8;
        break;
      case "others":
        this.discountPercentage = 2;
        break;
    }
    this.discountPrice = this.totalPrice * (this.discountPercentage / 100);
  }
}

class FinalPrice extends CategoryDiscount {
  constructor(name, type, price, qty) {
    super(name, type, price, qty);
    this.finalPurchasePrice = this.totalPrice - this.discountPrice;
  }
}

function calculate() {
  const errorBox = document.getElementById("errorMsg");
  const resultBox = document.getElementById("resultBox");
  errorBox.textContent = "";
  resultBox.style.display = "none";

  const name = document.getElementById("productName").value.trim();
  const type = document.getElementById("productType").value;
  const price = parseFloat(document.getElementById("productPrice").value);
  const qty = parseInt(document.getElementById("productQty").value);

  if (!name) {
    errorBox.textContent = "Please enter a product name.";
    return;
  }
  if (isNaN(price) || price <= 0) {
    errorBox.textContent = "Please enter a valid price.";
    return;
  }
  if (isNaN(qty) || qty <= 0) {
    errorBox.textContent = "Please enter a valid quantity.";
    return;
  }

  const item = new FinalPrice(name, type, price, qty);

  resultBox.style.display = "block";
  resultBox.innerHTML = `
    <strong>${item.productName}</strong> (${item.productType})<br>
    Total Price: ₹${item.totalPrice.toFixed(2)}<br>
    Discount (${item.discountPercentage}%): ₹${item.discountPrice.toFixed(2)}<br>
    <strong>Final Price: ₹${item.finalPurchasePrice.toFixed(2)}</strong>
  `;
}
</script>

</body>
</html>
